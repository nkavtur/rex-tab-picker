[package]
name = "rex-tabs"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for the Rex cmd+e tab picker"

[dependencies]
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
